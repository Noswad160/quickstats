name: probe

# One-off: fetch sample responses from each NBA data source so parsers can be written
# against real payloads. Saves them to the nba-probe branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch samples
        run: |
          mkdir -p probe && cd probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          get() {  # name url [extra curl args]
            name=$1; url=$2; shift 2
            code=$(curl -sS -m 30 -A "$UA" -o "$name" -w "%{http_code}" "$@" "$url" || echo ERR)
            echo "$code $(wc -c < "$name" 2>/dev/null || echo 0) $name $url" | tee -a INDEX.txt
          }
          E=https://site.api.espn.com/apis/site/v2/sports/basketball/nba
          get espn_scoreboard_20261024.json "$E/scoreboard?dates=20261024"
          get espn_scoreboard_20261025.json "$E/scoreboard?dates=20261025"
          get espn_scoreboard_20260415.json "$E/scoreboard?dates=20260415"
          EVENT=$(python3 -c "import json;print(json.load(open('espn_scoreboard_20261024.json'))['events'][0]['id'])" || true)
          UPCOMING=$(python3 -c "import json;print(json.load(open('espn_scoreboard_20261025.json'))['events'][0]['id'])" || true)
          get espn_summary_final.json "$E/summary?event=$EVENT"
          get espn_summary_upcoming.json "$E/summary?event=$UPCOMING"
          get espn_injuries.json "$E/injuries"
          get espn_teams.json "$E/teams"
          get espn_calendar.json "https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/seasons/2026/types/2/calendar"
          H=(-H "Referer: https://www.nba.com/" -H "Origin: https://www.nba.com" -H "Accept: application/json")
          get nba_leaguegamelog_p.json "https://stats.nba.com/stats/leaguegamelog?Counter=0&Direction=ASC&LeagueID=00&PlayerOrTeam=P&Season=2025-26&SeasonType=Regular%20Season&Sorter=DATE" "${H[@]}"
          get nba_cdn_schedule.json "https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json"
          get nba_cdn_scoreboard.json "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json"
          GID=$(python3 -c "import json;g=[x for x in json.load(open('nba_cdn_scoreboard.json'))['scoreboard']['games']];print(g[0]['gameId'])" || true)
          get nba_cdn_boxscore.json "https://cdn.nba.com/static/json/liveData/boxscore/boxscore_${GID}.json"
          get odds_api_sports.json "https://api.the-odds-api.com/v4/sports"
          ls -la
          # keep files small enough to commit
          for f in *.json; do python3 - "$f" <<'EOF'
          import json, sys
          p = sys.argv[1]
          try:
              d = json.load(open(p))
          except Exception:
              raise SystemExit
          def trim(x, depth=0):
              if isinstance(x, list):
                  return [trim(v, depth + 1) for v in x[:60]]
              if isinstance(x, dict):
                  return {k: trim(v, depth + 1) for k, v in x.items()}
              return x
          json.dump(trim(d), open(p, "w"), indent=1)
          EOF
          done
          ls -la

      - name: Commit to nba-probe branch
        run: |
          cd probe
          git init -q -b nba-probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -q -m "probe $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" nba-probe
