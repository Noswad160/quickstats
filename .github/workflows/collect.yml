name: collect

# GitHub runs scheduled workflows best-effort and often hours apart, so each run stays
# up for almost six hours, collecting every 15 minutes and pushing after each pass.
# The hourly schedule only has to start a run a few times a day; extra triggers queue
# behind the running one (concurrency) instead of overlapping it.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep collecting (0 = one pass)"
        default: "345"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" databranch
          else
            mkdir databranch && cd databranch && git init -q -b data && \
              git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          cd databranch
          git config user.name "wxbot"
          git config user.email "wxbot@users.noreply.github.com"

      - name: Restore analysis database
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wxbot.sqlite
          key: wxbot-db-${{ github.run_id }}
          restore-keys: wxbot-db-

      - name: Collect
        env:
          MINUTES: ${{ inputs.minutes || '345' }}
        run: |
          set +e  # one bad pass must not end the loop
          end=$(( $(date +%s) + MINUTES * 60 ))
          while :; do
            started=$(date +%s)
            python -m wxbot collect --out-dir databranch --forecast-every 170 || echo "::warning::collect failed"
            python -m wxbot observe --out-dir databranch --every 360 || echo "::warning::observe failed"
            # incremental: only run files not already in the database are loaded
            python -m wxbot --db /tmp/wxbot.sqlite load databranch
            python -m wxbot --db /tmp/wxbot.sqlite edges --report databranch/REPORT.md
            python -m wxbot --db /tmp/wxbot.sqlite scorecard --out databranch/SCORECARD.md
            python -m wxbot --db /tmp/wxbot.sqlite paper --out databranch/PAPER.md
            python -m wxbot --db /tmp/wxbot.sqlite export databranch/dashboard
            (
              cd databranch
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q -m "data $(date -u +%FT%TZ)"
                for i in 1 2 3 4; do git push -q origin HEAD:data && break; sleep $((2**i)); git pull -q --rebase origin data || true; done
              fi
            )
            next=$(( started + 900 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done

      - name: Save analysis database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/wxbot.sqlite
          key: wxbot-db-${{ github.run_id }}
