<style>
/* Layout: phone-first single column; sticky spot bar + tabs; cards only for the score, conditions and tips. */
:root {
  --bg: #edf1ef;
  --surface: #fbfcfb;
  --ink: #14201d;
  --muted: #586a65;
  --line: #d2dcd8;
  --water: #13605b;
  --water-soft: #d9ebe8;
  --accent: #d9560b;
  --accent-soft: #fbe6d8;
  --good: #2e7d3c;
  --warn: #a87100;
  --bad: #b03636;
  --s1: #b9c7c3;
  --s2: #d8b04a;
  --s3: #2f8f86;
  --s4: #d9560b;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1614; --surface: #13201d; --ink: #e2ebe8; --muted: #93a6a0; --line: #24362f;
    --water: #59b8ae; --water-soft: #173431; --accent: #ff7f3a; --accent-soft: #3a2316;
    --good: #6cc77a; --warn: #e0b04a; --bad: #ef7b7b;
    --s1: #3a4c47; --s2: #b8963a; --s3: #3fa79c; --s4: #ff7f3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1614; --surface: #13201d; --ink: #e2ebe8; --muted: #93a6a0; --line: #24362f;
  --water: #59b8ae; --water-soft: #173431; --accent: #ff7f3a; --accent-soft: #3a2316;
  --good: #6cc77a; --warn: #e0b04a; --bad: #ef7b7b;
  --s1: #3a4c47; --s2: #b8963a; --s3: #3fa79c; --s4: #ff7f3a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-size: 1.45rem; text-transform: uppercase; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--water); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 0; }
.brandrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; text-transform: uppercase; letter-spacing: .04em; color: var(--water); display: flex; align-items: center; gap: 6px; }
.brand svg { width: 22px; height: 22px; }
.pickers { display: flex; gap: 8px; flex: 1; min-width: 0; justify-content: flex-end; flex-wrap: wrap; }
.pickers select { max-width: 100%; min-width: 0; flex: 1 1 140px; }
.tabs { display: flex; gap: 4px; }
.tab { flex: 1; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 4px 9px; font-family: var(--f-display); font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 16px 48px; display: flex; flex-direction: column; gap: 18px; }

/* controls */
select, input, textarea, button { font: inherit; color: inherit; }
select, input[type="text"], input[type="number"], input[type="datetime-local"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { min-height: 64px; resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--water); background: var(--water); color: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--water); }
.btn.warn { background: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: .875rem; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; background: var(--surface); font-size: .9rem; }
.chk:has(input:checked) { border-color: var(--water); background: var(--water-soft); }
.chk input { accent-color: var(--water); margin: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.notice { border-left: 4px solid var(--warn); background: var(--surface); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: .925rem; }
.example { display: inline-block; font-family: var(--f-display); font-weight: 600; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 4px; vertical-align: middle; }

/* score hero */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.dial { width: 112px; height: 112px; position: relative; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dial .num b { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; }
.dial .num span { font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; }
.factors { display: flex; flex-wrap: wrap; gap: 6px; }
.factor { font-size: .82rem; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); white-space: nowrap; }
.factor.up { color: var(--good); border-color: currentColor; }
.factor.down { color: var(--bad); border-color: currentColor; }
.windows { display: flex; flex-wrap: wrap; gap: 8px; }
.win { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; min-width: 0; }
.win b { font-family: var(--f-mono); font-size: .9rem; font-weight: 500; }

/* conditions */
.conds { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cond { background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cond .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.cond .s { font-size: .78rem; color: var(--muted); }

/* chart */
.chart { overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 520px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* tips */
.phase { border-left: 4px solid var(--water); padding-left: 12px; display: flex; flex-direction: column; gap: 8px; }
.baits { display: flex; flex-wrap: wrap; gap: 6px; }
.bait { background: var(--water-soft); color: var(--ink); border-radius: 6px; padding: 3px 9px; font-size: .9rem; }
.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.tip { display: grid; grid-template-columns: 10px 1fr; gap: 10px; }
.tip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--s3); }
.tip.hi::before { background: var(--accent); }
.tip.lo::before { background: var(--s1); }
.tip b { display: block; }

/* lists */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 8px; align-items: center; font-size: .9rem; }
.bar .track { height: 8px; background: var(--water-soft); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--water); }
.bar .n { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); }
.empty { text-align: left; color: var(--muted); padding: 8px 0; }
@media (max-width: 420px) { .hero { grid-template-columns: 1fr; justify-items: start; } }
@media (prefers-reduced-motion: no-preference) { .dial circle.arc { transition: stroke-dashoffset .6s ease; } }
</style>

<script>
"use strict";
/* ---------------------------------------------------------------- astro
   Sun and moon positions (after Agafonkin's SunCalc). Times are epoch ms. */
const RAD = Math.PI / 180, DAY_MS = 864e5, J1970 = 2440588, J2000 = 2451545, OBL = RAD * 23.4397;
const toDays = ms => ms / DAY_MS - 0.5 + J1970 - J2000;
const rightAsc = (l, b) => Math.atan2(Math.sin(l) * Math.cos(OBL) - Math.tan(b) * Math.sin(OBL), Math.cos(l));
const decl = (l, b) => Math.asin(Math.sin(b) * Math.cos(OBL) + Math.cos(b) * Math.sin(OBL) * Math.sin(l));
const altitude = (H, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
const sidereal = (d, lw) => RAD * (280.16 + 360.9856235 * d) - lw;
function sunCoords(d) {
  const M = RAD * (357.5291 + 0.98560028 * d);
  const L = M + RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + RAD * 102.9372 + Math.PI;
  return { dec: decl(L, 0), ra: rightAsc(L, 0) };
}
function moonCoords(d) {
  const L = RAD * (218.316 + 13.176396 * d), M = RAD * (134.963 + 13.064993 * d), F = RAD * (93.272 + 13.229350 * d);
  const l = L + RAD * 6.289 * Math.sin(M), b = RAD * 5.128 * Math.sin(F);
  return { ra: rightAsc(l, b), dec: decl(l, b), dist: 385001 - 20905 * Math.cos(M) };
}
function bodyAlt(ms, lat, lon, coordsFn) {
  const d = toDays(ms), c = coordsFn(d);
  return altitude(sidereal(d, RAD * -lon) - c.ra, RAD * lat, c.dec) / RAD;
}
function moonIllum(ms) {
  const d = toDays(ms), s = sunCoords(d), m = moonCoords(d), sd = 149598000;
  const phi = Math.acos(Math.sin(s.dec) * Math.sin(m.dec) + Math.cos(s.dec) * Math.cos(m.dec) * Math.cos(s.ra - m.ra));
  const inc = Math.atan2(sd * Math.sin(phi), m.dist - sd * Math.cos(phi));
  const angle = Math.atan2(Math.cos(s.dec) * Math.sin(s.ra - m.ra), Math.sin(s.dec) * Math.cos(m.dec) - Math.cos(s.dec) * Math.sin(m.dec) * Math.cos(s.ra - m.ra));
  return { fraction: (1 + Math.cos(inc)) / 2, phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI };
}
function moonPhaseName(p) {
  if (p < 0.03 || p > 0.97) return "New moon";
  if (p < 0.22) return "Waxing crescent";
  if (p < 0.28) return "First quarter";
  if (p < 0.47) return "Waxing gibbous";
  if (p < 0.53) return "Full moon";
  if (p < 0.72) return "Waning gibbous";
  if (p < 0.78) return "Last quarter";
  return "Waning crescent";
}
// Scan a time range in 10-minute steps for sunrise/sunset, moonrise/moonset and moon transits.
function astroEvents(t0, t1, lat, lon) {
  const step = 6e5, out = { sunrise: [], sunset: [], solunar: [] };
  let pS = bodyAlt(t0, lat, lon, sunCoords), pM = bodyAlt(t0, lat, lon, moonCoords), ppM = bodyAlt(t0 - step, lat, lon, moonCoords);
  for (let t = t0 + step; t <= t1; t += step) {
    const s = bodyAlt(t, lat, lon, sunCoords), m = bodyAlt(t, lat, lon, moonCoords);
    if (pS < -0.833 && s >= -0.833) out.sunrise.push(t);
    if (pS >= -0.833 && s < -0.833) out.sunset.push(t);
    if (pM < 0.133 && m >= 0.133) out.solunar.push({ type: "minor", center: t, why: "Moonrise" });
    if (pM >= 0.133 && m < 0.133) out.solunar.push({ type: "minor", center: t, why: "Moonset" });
    if (pM > ppM && pM >= m) out.solunar.push({ type: "major", center: t - step, why: "Moon overhead" });
    if (pM < ppM && pM <= m) out.solunar.push({ type: "major", center: t - step, why: "Moon underfoot" });
    ppM = pM; pM = m; pS = s;
  }
  out.solunar.forEach(w => { const half = w.type === "major" ? 3.6e6 : 1.8e6; w.start = w.center - half; w.end = w.center + half; });
  out.solunar.sort((a, b) => a.center - b.center);
  return out;
}

/* ---------------------------------------------------------------- reference data */
const WATER_TYPES = {
  lake: { name: "Lake", env: "fresh" }, reservoir: { name: "Reservoir", env: "fresh" }, pond: { name: "Pond", env: "fresh" },
  river: { name: "River / stream", env: "fresh" },
  inshore: { name: "Inshore bay / marsh", env: "salt" }, surf: { name: "Surf / beach", env: "salt" }, pier: { name: "Pier / jetty", env: "salt" },
};
const STRUCTURES = {
  points: { name: "Points", env: "fresh" }, grass: { name: "Weeds / grass", env: "fresh" }, docks: { name: "Docks", env: "both" },
  rock: { name: "Rock / riprap", env: "fresh" }, dropoff: { name: "Drop-offs / ledges", env: "fresh" }, wood: { name: "Laydowns / wood", env: "fresh" },
  brush: { name: "Brush piles", env: "fresh" }, inflow: { name: "Creek mouths / inflows", env: "fresh" }, bridge: { name: "Bridges", env: "both" },
  seam: { name: "Current seams / eddies", env: "fresh" }, flats: { name: "Shallow flats", env: "fresh" }, humps: { name: "Offshore humps", env: "fresh" },
  grassflat: { name: "Grass flats", env: "salt" }, oyster: { name: "Oyster bars", env: "salt" }, mangrove: { name: "Mangroves / marsh edge", env: "salt" },
  jetty: { name: "Jetty / rocks", env: "salt" }, inlet: { name: "Inlet / pass", env: "salt" }, drain: { name: "Marsh drains / creek mouths", env: "salt" },
  channel: { name: "Channel edges", env: "salt" }, trough: { name: "Surf troughs / cuts", env: "salt" },
};

// Phases: first entry whose temp range (°F, min inclusive / max exclusive) and season match wins.
const SPECIES = {
  lmb: { name: "Largemouth bass", env: "fresh", opt: [65, 80], live: [40, 90], lowLight: .8, night: .4, phases: [
    { max: 45, name: "Winter", where: "Steep banks, bluff walls and channel swings close to the deepest water. Fish stack up and move very little.", baits: ["Football jig, slow drag", "Blade bait, lift and fall", "Suspending jerkbait with 10–20 s pauses", "Drop shot"], how: "Slow everything down. On sunny afternoons, shallow rock near deep water warms a few degrees and pulls fish up." },
    { max: 55, season: "warming", name: "Early prespawn", where: "Secondary points and channel swings leading into spawning pockets. The {sunShore}, which gets the most sun, warms first.", baits: ["Suspending jerkbait", "Lipless crankbait ripped through grass", "Chatterbait", "Jig on rock"], how: "Fish the warmest water you can find. A 2–3° difference matters a lot right now." },
    { max: 62, season: "warming", name: "Prespawn", where: "The first break outside spawning flats and pockets, rock-to-clay transition banks, and docks near spawning areas.", baits: ["Medium-diving crankbait", "Spinnerbait", "Chatterbait", "Texas-rigged creature bait"], how: "The biggest females of the year are feeding up. Cover water along staging areas, then slow down where you get bit." },
    { max: 73, season: "warming", name: "Spawn & postspawn", where: "Shallow, wind-protected pockets with hard bottom. Bedding fish are visible in clear water; males guard fry balls afterwards.", baits: ["Wacky-rigged stick worm", "Texas-rigged creature bait", "Weightless fluke", "Walking topwater at dawn"], how: "Watch for the shad spawn on riprap and seawalls at first light. Release bedding fish quickly, right where you caught them." },
    { min: 80, name: "Summer", where: "Offshore ledges, humps and deep grass lines through midday. Shade under docks and matted grass. Shallow only at low light.", baits: ["10–12 in. Texas-rig worm or Carolina rig on ledges", "Deep-diving crankbait", "Hollow-body frog on mats", "Buzzbait or walking topwater at dawn"], how: "On reservoirs, the bite turns on when the dam is generating and current moves. Night fishing with dark spinnerbaits and big worms is strong." },
    { min: 55, max: 76, season: "cooling", name: "Fall transition", where: "Baitfish move to the backs of creeks and pockets and bass follow, roaming shallow flats.", baits: ["Lipless crankbait", "Squarebill crankbait", "Spinnerbait", "Walking topwater"], how: "Find the bait first. Watch for surface activity and birds, cover water fast, and don't sit on one spot." },
    { max: 55, season: "cooling", name: "Late fall", where: "Fish group up on main-lake points and channel bends as the water cools.", baits: ["Jerkbait", "Jig", "Blade bait", "Flat-sided crankbait"], how: "When you catch one, slow down and work the area thoroughly. They're grouped up." },
    { name: "Early summer", where: "Postspawn fish moving to the first deep breaks, main-lake points and grass edges.", baits: ["Topwater popper or walker early", "Swimbait", "Shaky head", "Carolina rig"], how: "Fish shallow early, then follow them out to the first drop as the sun gets up." },
  ]},
  smb: { name: "Smallmouth bass", env: "fresh", opt: [60, 73], live: [38, 85], lowLight: .5, night: .2, phases: [
    { max: 50, name: "Cold water", where: "Deep rock, bluff ends and wintering holes in 20–40 ft. In rivers, slow deep pools out of the current.", baits: ["Suspending jerkbait (clear water in the 40s °F is prime)", "Hair jig", "Ned rig", "Blade bait"], how: "Long pauses. Most bites come while the bait sits still." },
    { max: 60, season: "warming", name: "Prespawn", where: "Rocky points and gravel flats next to deep water. Fish move up on warm, sunny days.", baits: ["Jerkbait", "Tube jig", "Ned rig", "Small swimbait"], how: "Look for the warmest rock in the system after a few sunny days." },
    { max: 68, season: "warming", name: "Spawn", where: "Gravel and chunk rock in 3–10 ft, often beside a boulder or log, in protected bays.", baits: ["Tube", "Ned rig", "Drop shot", "Wacky worm"], how: "Polarized glasses help you spot beds. Release fish quickly so they can guard the nest." },
    { min: 74, name: "Summer", where: "Offshore humps, rock piles and deep points. River fish sit in current seams below riffles.", baits: ["Drop shot", "Tube", "Topwater walker or popper early", "Crayfish crankbait"], how: "Wind and current turn them on. Fish the windy side of rock humps." },
    { min: 50, max: 68, season: "cooling", name: "Fall", where: "Fish feed hard on main-lake points and flats with baitfish. River fish slide to wintering pools as it cools.", baits: ["Swimbait", "Jerkbait", "Spinnerbait", "Hair jig"], how: "Big fish of the year time. Cover water until you find the bait." },
    { name: "Early summer", where: "Postspawn fish moving to rocky points and the first deep break.", baits: ["Drop shot", "Ned rig", "Topwater", "Tube"], how: "Follow the rock out from the spawning areas." },
  ]},
  crappie: { name: "Crappie", env: "fresh", opt: [60, 75], live: [38, 88], lowLight: .7, night: .6, phases: [
    { max: 50, name: "Winter", where: "Suspended over channel bends and deep brush in 15–30 ft, in tight schools.", baits: ["1/32–1/16 oz jig, vertical", "Live minnow under a slip float", "Small blade bait"], how: "Use electronics. Hold the bait just above the school; bites are very light." },
    { max: 58, season: "warming", name: "Prespawn", where: "Channel edges and brush leading into creeks and shallow flats.", baits: ["Jig tipped with a minnow", "Small swimbait jig", "Minnow under slip float"], how: "They move up and back with every warm or cold day. Follow the temperature." },

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COMPASS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
const COMPASS_LONG = { N: "north", NE: "northeast", E: "east", SE: "southeast", S: "south", SW: "southwest", W: "west", NW: "northwest" };
const compass = deg => COMPASS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
const compass8 = deg => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const DIR_DEG = { N: 0, NE: 45, E: 90, SE: 135, S: 180, SW: 225, W: 270, NW: 315 };
function shifted(ms, tz) { return new Date(ms + tz * 1000); }
function fmtTime(ms, tz) {
  const d = shifted(ms, tz); let h = d.getUTCHours(); const m = d.getUTCMinutes();
  const ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12;
  return h + ":" + String(m).padStart(2, "0") + " " + ap;
}
function fmtHour(ms, tz) { const h = shifted(ms, tz).getUTCHours(); return (h % 12 || 12) + (h < 12 ? "a" : "p"); }
function fmtDay(ms, tz) { return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][shifted(ms, tz).getUTCDay()]; }
function fmtDate(ms, tz) { const d = shifted(ms, tz); return fmtDay(ms, tz) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getUTCMonth()] + " " + d.getUTCDate(); }
const deviceTz = () => -new Date().getTimezoneOffset() * 60;
async function getJSON(url, ms = 9000) {
  const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, { signal: ac.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(timer); }
}
function envOf(spot) { return (WATER_TYPES[spot.water] || WATER_TYPES.lake).env; }
function seasonOf(ms, tz, lat) {
  let m = shifted(ms, tz).getUTCMonth(); if (lat < 0) m = (m + 6) % 12;

/* ---------------------------------------------------------------- storage
   Inside a Claude artifact, spots and catches go to the viewer's private db subtree.
   Anywhere else (or if that is unavailable) they stay in this browser's localStorage. */
const LS_KEY = "fishcast.v1";
const Store = {
  mode: "local", items: {}, col: null,
  loadLocal() { try { this.items = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { this.items = {}; } },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.items)); } catch (e) { /* storage blocked */ } },
  async connect() {
    if (!window.claude || typeof window.claude.use !== "function") return false;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const id = user && await user.id();
      if (!db || !id) return false;
      const col = db.collection("data/users/" + id);
      const snap = await col.get();
      const items = {};
      snap.docs.forEach(d => { if (d.exists) items[d.id] = d.data(); });
      this.col = col; this.items = items; this.mode = "cloud";
      return true;
    } catch (e) { return false; }
  },
  list(kind) { return Object.entries(this.items).filter(([, v]) => v && v.kind === kind).map(([id, v]) => ({ ...v, id })); },
  async put(id, obj) {
    const clean = JSON.parse(JSON.stringify(obj)); delete clean.id;
    this.items[id] = clean;
    if (this.mode === "cloud") { try { await this.col.doc(id).set(clean); } catch (e) { toast("Couldn't save to your account: " + (e.message || e.code || "error") + ". Kept on this device."); this.saveLocal(); } }
    else this.saveLocal();
  },
  async del(id) {
    delete this.items[id];
    if (this.mode === "cloud") { try { await this.col.doc(id).delete(); } catch (e) { /* stays removed locally */ } }
    else this.saveLocal();
  },
};

/* ---------------------------------------------------------------- conditions */
const hourMs = 36e5;
function nowHour() { return Math.floor(Date.now() / hourMs) * hourMs; }
function deriveHours(hours) {
  for (let i = 0; i < hours.length; i++) {
    const h = hours[i];
    h.trend3 = i >= 3 ? h.pres - hours[i - 3].pres : 0;
    let p24 = 0; for (let k = Math.max(0, i - 23); k <= i; k++) p24 += hours[k].precip || 0;
    h.precip24 = p24;
    // Post-front: pressure has climbed ≥0.10 inHg from a low within the last 36 h.
    let lo = h.pres, loAt = i;
    for (let k = Math.max(0, i - 36); k <= i; k++) if (hours[k].pres < lo) { lo = hours[k].pres; loAt = k; }
    h.front = (h.pres - lo >= 0.10 && i - loAt >= 3) ? "post" : (h.trend3 <= -0.03 ? "pre" : "stable");
  }
  return hours;
}
async function loadLive(spot) {
  const q = new URLSearchParams({
    latitude: spot.lat, longitude: spot.lon,
    hourly: "temperature_2m,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,precipitation",
    temperature_unit: "fahrenheit", wind_speed_unit: "mph", precipitation_unit: "inch",
    timeformat: "unixtime", timezone: "auto", past_days: 7, forecast_days: 3,
  });
  const j = await getJSON("https://api.open-meteo.com/v1/forecast?" + q);
  const H = j.hourly, last = {};
  const pick = (k, i) => { const v = H[k][i]; if (v != null) last[k] = v; return last[k] ?? 0; };
  const hours = H.time.map((t, i) => ({
    t: t * 1000, air: pick("temperature_2m", i), pres: pick("pressure_msl", i) * 0.02953,
    wind: pick("wind_speed_10m", i), dir: pick("wind_direction_10m", i), gust: pick("wind_gusts_10m", i),
    cloud: pick("cloud_cover", i), precip: pick("precipitation", i),
  }));
  deriveHours(hours);
  const cond = { mode: "live", hours, tz: j.utc_offset_seconds || 0, fetchedAt: Date.now(), sst: null, wave: null };
  if (envOf(spot) === "salt") {
    try {
      const mq = new URLSearchParams({ latitude: spot.lat, longitude: spot.lon, hourly: "sea_surface_temperature,wave_height", temperature_unit: "fahrenheit", timeformat: "unixtime", timezone: "auto", forecast_days: 2 });
      const m = await getJSON("https://marine-api.open-meteo.com/v1/marine?" + mq);
      const i = m.hourly.time.findIndex(t => t * 1000 >= nowHour());
      const at = k => { const arr = m.hourly[k] || []; for (let x = Math.max(0, i); x < arr.length; x++) if (arr[x] != null) return arr[x]; return null; };
      cond.sst = at("sea_surface_temperature");
      const wv = at("wave_height"); cond.wave = wv == null ? null : wv * 3.281;
    } catch (e) { /* marine data is optional */ }
  }
  // Rough surface-temperature estimate from recent air temps; shallow water tracks air faster.
  const now = nowHour(), span = (spot.water === "pond" || spot.water === "river") ? 96 : 168;
  const past = hours.filter(h => h.t <= now && h.t > now - span * hourMs);
  if (past.length) {
    const avg = past.reduce((a, h) => a + h.air, 0) / past.length;
    cond.waterEst = Math.round(clamp(avg + (avg > 60 ? 2 : 0), 33, 95));
  }
  return cond;
}
function manualCond(spot) {
  const M = S.manual, tz = deviceTz(), start = nowHour() - 48 * hourMs, hours = [];
  const cloud = { sunny: 10, partly: 45, overcast: 90, rain: 100 }[M.sky];
  const trend3 = { falling: -0.05, steady: 0, rising: 0.04, "post-front": 0.06 }[M.trend];
  for (let i = 0; i < 100; i++) {
    const t = start + i * hourMs, ahead = (t - nowHour()) / hourMs;
    const fresh = ahead >= -2 && ahead <= 12; // what you see now lasts about half a day
    hours.push({ t, air: Number(M.air), pres: 30.0, wind: Number(M.wind), dir: DIR_DEG[M.windDir] ?? 225, gust: Number(M.wind) * 1.4,
      cloud, precip: M.sky === "rain" ? 0.05 : 0, precip24: M.sky === "rain" ? 0.3 : 0,
      trend3: fresh ? trend3 : 0, front: fresh ? (M.trend === "post-front" ? "post" : M.trend === "falling" ? "pre" : "stable") : "stable" });
  }
  return { mode: "manual", hours, tz, fetchedAt: Date.now(), waterEst: Number(M.water), sst: null, wave: null };
}
function waterOf(spot, cond) {

  const water = waterOf(spot, cond);

    <div class="cond"><span class="label">Moon</span><span class="v">${Math.round(moon.fraction * 100)}%</span><span class="s">${moonPhaseName(moon.phase)}</span></div>
    ${isSalt && ctx.wave != null ? `<div class="cond"><span class="label">Waves</span><span class="v">${ctx.wave.toFixed(1)} ft</span><span class="s">marine forecast</span></div>` : ""}

function historyCard(ctx) {
  const spot = ctx.spot, salt = ctx.env === "salt";
  const here = entries().filter(e => e.spotId === spot.id && e.count > 0);
  const now = snapFromCtx(ctx);
  const forSp = here.filter(e => e.species === curSpecies(spot));
  const pool = forSp.length ? forSp : here;
  const similar = pool.map(e => ({ e, sim: similarity(now, e.snap, salt) })).filter(x => x.sim >= 0.6).sort((a, b) => b.sim - a.sim);
  let body;
  if (!here.length) body = `<p class="muted small">No catches logged here yet. Log each catch (and each trip where you got nothing) and Fishcast will learn what works at this spot in conditions like today's.</p>`;
  else if (!similar.length) body = `<p class="small">None of your ${pool.length} catches here came in conditions like today's (${now.water}°F, ${now.trend} pressure, ${now.sky}, ${now.light}). Your best lures here overall: ${tally(pool, "lure").slice(0, 3).map(([l, n]) => `<b>${esc(l)}</b> (${n})`).join(", ") || "none recorded"}.</p>`;
  else {
    const lures = tally(similar.map(x => x.e), "lure").slice(0, 4);
    body = `<p class="small">${similar.length} of your catches here came in conditions like now. What they hit:</p>
      <div class="bars">${lures.map(([l, n]) => `<div class="bar"><span>${esc(l)}</span><span class="track"><span class="fill" style="width:${Math.round(n / lures[0][1] * 100)}%;display:block"></span></span><span class="n">${n}</span></div>`).join("")}</div>
      <p class="small muted">Closest match: ${fmtDate(similar[0].e.t, ctx.tz)}, ${similar[0].e.snap.water}°F, ${esc(similar[0].e.snap.trend)}, ${esc(similar[0].e.snap.sky)}, ${esc(similar[0].e.lure || "no lure noted")}${similar[0].e.depth ? ", " + esc(similar[0].e.depth) + " ft" : ""}.</p>`;
  }
  return `<section class="card" aria-label="Your history here"><h3>Your history at this spot ${spot.example ? '<span class="example">Example</span>' : ""}</h3>${body}<div class="row"><button class="btn sm ghost" data-act="gotoLog">Log a catch</button></div></section>`;
}

function renderLog() {
  const spot = curSpot(), sp = curSpecies(spot), all = entries(), tz = S.cond?.tz ?? deviceTz();
  const here = all.filter(e => e.spotId === spot.id).sort((a, b) => b.t - a.t);
  const catches = here.filter(e => e.count > 0), blanks = here.filter(e => !e.count);
  let html = `<section class="card" aria-label="Log">
    <div class="row" style="justify-content:space-between"><h2>Log at ${esc(spot.name)}</h2>${spot.example ? '<span class="example">Example</span>' : ""}</div>

      <label class="chk"><input type="radio" name="lkind" value="blank"${S.logKind === "blank" ? " checked" : ""}>Fished, no bites</label>
    </div>
    <form id="logForm" class="grid2" novalidate>
      ${S.logKind === "catch" ? `
      <label class="field"><span class="label">Species</span><select id="lSpecies">${Object.entries(SPECIES).filter(([, v]) => v.env === envOf(spot)).map(([k, v]) => `<option value="${k}"${k === sp ? " selected" : ""}>${v.name}</option>`).join("")}</select></label>

      : `<label class="field"><span class="label">Hours fished</span><input type="number" id="lHours" value="2" min="0.5" step="0.5"></label>
      <label class="field"><span class="label">What you tried</span><input type="text" id="lLure" list="lureList" placeholder="Jerkbait, jig"></label>`}
      <label class="field" style="grid-column:1/-1"><span class="label">Notes</span><input type="text" id="lNotes" placeholder="${S.logKind === "catch" ? "Off the windy side of the point" : "Tried points and docks"}"></label>
      <datalist id="lureList">${tally(all, "lure").map(([l]) => `<option value="${esc(l)}"></option>`).join("")}</datalist>
      <div class="row" style="grid-column:1/-1"><button class="btn" type="submit">${S.logKind === "catch" ? "Log catch" : "Log trip"}</button><span class="small muted">Saves the time and current conditions with it.</span></div>
    </form>
  </section>`;

  if (catches.length) {
    const total = catches.reduce((a, e) => a + (e.count || 1), 0);
    const hrs = blanks.reduce((a, e) => a + (e.hours || 0), 0);
    const section = (title, rows) => rows.length ? `<div class="field"><span class="label">${title}</span><div class="bars">${rows.slice(0, 5).map(([k, n]) => `<div class="bar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${Math.round(n / rows[0][1] * 100)}%;display:block"></span></span><span class="n">${n}</span></div>`).join("")}</div></div>` : "";
    const band = e => e.snap?.water == null ? "" : (Math.floor(e.snap.water / 5) * 5) + "–" + (Math.floor(e.snap.water / 5) * 5 + 4) + "°F";
    html += `<section class="card" aria-label="Patterns">
      <h3>Patterns at this spot</h3>
      <p class="small">${total} fish logged${blanks.length ? `, plus ${blanks.length} trip${blanks.length > 1 ? "s" : ""} (${hrs} h) with no bites` : ""}.</p>
      <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
        ${section("Lures", tally(catches, "lure"))}
        ${section("Time of day", tally(catches, e => e.snap?.light))}
        ${section("Pressure", tally(catches, e => e.snap?.trend))}
        ${section("Sky", tally(catches, e => e.snap?.sky))}
        ${section("Water temp", tally(catches, band))}
        ${envOf(spot) === "salt" ? section("Tide", tally(catches, e => e.snap?.tide)) : section("Solunar", tally(catches, e => e.snap?.solunar || "outside window"))}
      </div>
    </section>`;
  }

  html += `<section aria-label="History" class="list"><h3>History</h3>${here.length ? here.map(e => `<div class="item">
    <div class="head"><b>${e.count > 0 ? `${e.count > 1 ? e.count + " × " : ""}${esc(SPECIES[e.species]?.name || e.species)}${e.length ? ` · ${esc(e.length)} in` : ""}` : `No bites · ${esc(e.hours)} h`}</b><span class="small muted">${fmtDate(e.t, tz)} ${fmtTime(e.t, tz)}</span></div>
    <span class="small">${esc(e.lure || "")}${e.depth ? ` · ${esc(e.depth)} ft` : ""}${e.notes ? ` · ${esc(e.notes)}` : ""}</span>
    ${e.snap ? `<span class="small muted">${e.snap.water}°F water · ${esc(e.snap.trend)} · ${esc(e.snap.sky)} · ${esc(e.snap.light)}${e.snap.wind != null ? ` · wind ${e.snap.wind} ${esc(e.snap.windDir || "")}` : ""}${e.snap.tide ? ` · ${esc(e.snap.tide)} tide` : ""}</span>` : ""}
    ${e.example ? '<span><span class="example">Example</span></span>' : `<div class="row"><button class="btn sm ghost" data-act="delentry" data-id="${esc(e.id)}">Delete</button></div>`}
  </div>`).join("") : '<p class="empty">Nothing logged at this spot yet.</p>'}</section>`;
  view.innerHTML = html;
}

/* ---------------------------------------------------------------- actions */
async function loadConditions(force) {
  const spot = curSpot();
  if (S.loading) return;
  S.loading = true; S.liveError = ""; render();
  try {
    if (S.forceManual && !force) throw new Error("manual");
    S.cond = await loadLive(spot); S.forceManual = false;
  } catch (e) {
    S.liveError = e.message === "manual" ? "" : "Live weather couldn't be reached from here" + (e.name === "AbortError" ? " (timed out)." : ".");
    S.cond = manualCond(spot);
  }
  S.condFor = spot.id; S.loading = false; render();
}
function parseCoords(str) {
  const m = String(str).match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
  if (!m) return null;
  const lat = Number(m[1]), lon = Number(m[2]);
  return Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? { lat, lon } : null;
}
function readSpotForm() {
  const s = { ...S.editing };
  s.name = $("#fName").value.trim(); s.water = $("#fWater").value; s.clarity = $("#fClarity").value; s.notes = $("#fNotes").value.trim();
  s.structures = [...document.querySelectorAll('input[name="fStruct"]:checked')].map(x => x.value);
  s.species = [...document.querySelectorAll('input[name="fSpecies"]:checked')].map(x => x.value);
  const c = parseCoords($("#fCoords").value); s.lat = c?.lat; s.lon = c?.lon;
  return s;
}
document.addEventListener("click", async e => {
  const tab = e.target.closest(".tab");
  if (tab) { S.tab = tab.dataset.tab; S.editing = null; render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "newspot") { S.tab = "spots"; S.editing = { kind: "spot", name: "", water: "lake", clarity: "stained", structures: [], species: [] }; render(); }
  else if (act === "editspot") { S.editing = { ...Store.list("spot").find(s => s.id === id) }; render(); }
  else if (act === "cancelEdit") { S.editing = null; render(); }
  else if (act === "openspot") { S.spotId = id; S.speciesId = null; S.tab = "today"; render(); }
  else if (act === "askdel") { S.confirmDel = id; render(); }
  else if (act === "canceldel") { S.confirmDel = null; render(); }
  else if (act === "delspot") {
    for (const c of Store.list("catch").filter(c => c.spotId === id)) await Store.del(c.id);
    await Store.del(id); S.confirmDel = null; if (S.spotId === id) { S.spotId = null; S.cond = null; } render(); toast("Spot deleted");
  }
  else if (act === "delentry") { await Store.del(id); render(); toast("Entry deleted"); }
  else if (act === "retry") { S.cond = null; S.forceManual = false; loadConditions(true); }
  else if (act === "gotoLog") { S.tab = "log"; render(); }
  else if (act === "applyManual") {
    S.manual = { air: $("#mAir").value || 68, water: $("#mWater").value || 64, wind: $("#mWind").value || 0, windDir: $("#mDir").value, sky: $("#mSky").value, trend: $("#mTrend").value };
    S.cond = manualCond(curSpot()); render(); toast("Forecast updated");
  }
  else if (act === "saveReading") {
    const spot = curSpot(), r = { ...(spot.reading || {}) }, w = $("#rdWater").value;
    r.at = Date.now(); r.water = w === "" ? null : Number(w); r.clarity = $("#rdClarity").value;
    if ($("#rdTide")) { r.tide = $("#rdTide").value; r.tideAt = Date.now(); }
    if (spot.example) { EXAMPLE_SPOT.reading = r; } else await Store.put(spot.id, { ...spot, reading: r });
    render(); toast("Tips updated");
  }
  else if (act === "geoloc") {
    if (!navigator.geolocation) { toast("Location isn't available here. Paste coordinates instead."); return; }
    navigator.geolocation.getCurrentPosition(p => { $("#fCoords").value = p.coords.latitude.toFixed(5) + ", " + p.coords.longitude.toFixed(5); },
      () => toast("Location isn't available here. Paste coordinates instead."), { timeout: 10000 });
  }
  else if (act === "search") {
    const q = $("#fSearch").value.trim(), out = $("#searchOut"); if (!q) return;
    out.textContent = "Searching…";
    try {
      const j = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=5&name=" + encodeURIComponent(q));
      const rs = j.results || [];
      out.innerHTML = rs.length ? rs.map(r => `<button type="button" class="btn sm ghost" data-act="pickplace" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${esc(r.name)}">${esc([r.name, r.admin1, r.country_code].filter(Boolean).join(", "))}</button>`).join("") : "No matches. Try a nearby town.";
    } catch (err) { out.textContent = "Search isn't available here. Paste coordinates instead."; }
  }
  else if (act === "pickplace") {
    $("#fCoords").value = Number(b.dataset.lat).toFixed(4) + ", " + Number(b.dataset.lon).toFixed(4);
    if (!$("#fName").value) $("#fName").value = b.dataset.name;
    $("#searchOut").innerHTML = "";
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "spotPick") { S.spotId = e.target.value; S.speciesId = null; S.cond = null; render(); }
  else if (e.target.id === "speciesPick") { S.speciesId = e.target.value; render(); }
  else if (e.target.name === "lkind") { S.logKind = e.target.value; render(); }
  else if (e.target.id === "fWater") { S.editing = readSpotForm(); render(); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "spotForm") {
    const s = readSpotForm(), err = $("#formErr");
    const problem = !s.name ? "Give the spot a name." : s.lat == null ? "Add a location: paste coordinates like 34.42, -86.23, or search." : "";
    if (problem) { err.textContent = problem; err.hidden = false; return; }
    const id = s.id || uid("spot"); s.kind = "spot";
    await Store.put(id, s); S.editing = null; S.spotId = id; S.speciesId = null; S.cond = null; S.tab = "today"; render(); toast("Spot saved");
  } else if (e.target.id === "logForm") {
    const spot = curSpot();
    if (spot.example) { toast("Add a spot of your own first. Example entries aren't saved."); return; }
    if (!S.cond || S.condFor !== spot.id) { toast("Conditions are still loading. Try again in a moment."); return; }
    const ctx = buildCtx(), entry = { kind: "catch", spotId: spot.id, t: Date.now(), snap: snapFromCtx(ctx), lure: $("#lLure").value.trim(), notes: $("#lNotes").value.trim() };
    if (S.logKind === "catch") {
      Object.assign(entry, { species: $("#lSpecies").value, length: $("#lLen").value, depth: $("#lDepth").value, count: Math.max(1, Number($("#lCount").value) || 1) });
    } else Object.assign(entry, { count: 0, hours: Number($("#lHours").value) || 0 });
    await Store.put(uid("catch"), entry); render(); toast(S.logKind === "catch" ? "Catch logged" : "Trip logged");
  }
});

/* ---------------------------------------------------------------- boot */
Store.loadLocal();
try { const t = localStorage.getItem("fishcast.tab"); if (t) S.tab = t; } catch (e) {}
window.addEventListener("pagehide", () => { try { localStorage.setItem("fishcast.tab", S.tab); } catch (e) {} });
render();
Store.connect().then(ok => { if (ok) { S.cond = null; S.spotId = null; render(); } });
</script>
